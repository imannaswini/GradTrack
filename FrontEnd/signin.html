<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In - GradTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Inline specific styling for auth inputs to override bootstrap defaults cleanly */
    .auth-input {
      background-color: var(--bg-input) !important;
      border: 1px solid var(--border-color) !important;
      color: var(--text-primary) !important;
      padding: 0.75rem 1rem;
      border-radius: 8px;
    }
    .auth-input:focus {
      border-color: var(--accent-primary) !important;
      box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25) !important;
    }
  </style>
</head>
<body>
  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <div class="main-content d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 100px);">
    <div class="glass-panel p-5 w-100 hover-lift" style="max-width: 420px; animation: fadeUp 0.6s ease forwards;">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px;">
          <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="GradTrack Logo"/>
        </div>
        <h3 class="fw-bold mb-1">Welcome Back 👋</h3>
        <p class="text-secondary small">Sign in to your GradTrack dashboard.</p>
      </div>
      
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label text-secondary small fw-semibold">Email Address</label>
          <input type="email" class="form-control auth-input" placeholder="name@example.com" name="email" required />
        </div>
        <div class="mb-4">
          <label class="form-label text-secondary small fw-semibold">Password</label>
          <input type="password" class="form-control auth-input" placeholder="••••••••" name="password" required />
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 mb-3 py-2">Sign In</button>
      </form>



      <div class="text-center mt-4">
        <p class="small text-secondary mb-2"><a href="frgtpass.html" class="text-decoration-none text-gradient fw-semibold">Forgot Password?</a></p>
        <p class="small text-secondary">Don't have an account? <a href="signup.html" class="text-decoration-none text-gradient fw-semibold">Sign Up</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = e.target.email.value;
      const password = e.target.password.value;
      const btn = e.target.querySelector('button[type="submit"]');
      const originalText = btn.innerHTML;

      btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing In...`;
      btn.disabled = true;

      try {
        const res = await fetch("http://127.0.0.1:3000/api/signin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        btn.innerHTML = originalText;
        btn.disabled = false;

        if (res.ok) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("userEmail", data.user.email);
          localStorage.setItem("userName", data.user.name);
          localStorage.setItem("loggedIn", "true");
          window.showToast("Signed in successfully!", "success");
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        } else {
          window.showToast(data.message || "Invalid credentials", "error");
        }
      } catch (error) {
        btn.innerHTML = originalText;
        btn.disabled = false;
        window.showToast("Connection error. Please try again.", "error");
      }
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
