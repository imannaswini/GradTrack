<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connect & Network - GradTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .network-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    .network-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-primary);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .network-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--bg-card);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
    }
    .network-info h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      padding-right: 90px; /* Space for avatar */
    }
    .network-info p.role {
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      padding-right: 90px;
    }
    
    .network-meta {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .network-meta-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    
    .search-container {
      background: var(--glass-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <div id="navbar-container"></div>

  <div class="main-content">
    
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4">
      <div>
        <h2 class="fw-bold mb-1">Professional Network 🤝</h2>
        <p class="text-secondary mb-0">Connect with alumni, mentors, and peers in your industry.</p>
      </div>
    </div>

    <!-- Search & Filters -->
    <div class="search-container mb-5">
      <div class="row g-3">
        <div class="col-md-6">
          <input type="text" class="form-control auth-input" placeholder="Search by name, role, or company..." id="searchInput">
        </div>
        <div class="col-md-3">
          <select class="form-select auth-input" id="fieldFilter">
            <option value="">All Domains</option>
            <option value="software">Software Engineering</option>
            <option value="mechanical">Mechanical Engineering</option>
            <option value="electrical">Electrical Engineering</option>
            <option value="civil">Civil Engineering</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select auth-input" id="experienceFilter">
            <option value="">All Experience Levels</option>
            <option value="0-2">Entry Level (0-2 yrs)</option>
            <option value="3-5">Mid Level (3-5 yrs)</option>
            <option value="5+">Senior Level (5+ yrs)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Professionals Grid -->
    <div class="row g-4" id="professionalsGrid">
        <!-- Professional cards injected via JS -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="glass-panel text-center p-5 mt-4 d-none">
      <h3 class="mb-2">🔍 No professionals found</h3>
      <p class="text-secondary">Try adjusting your search criteria or filters.</p>
      <button class="btn btn-outline-custom mt-2" onclick="document.getElementById('searchInput').value=''; document.getElementById('fieldFilter').value=''; document.getElementById('experienceFilter').value=''; filterProfessionals();">Reset Filters</button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script>
    const professionals = [
      { id: 1, name: "John Doe", field: "software", experience: "5+", email: "john.doe@email.com", phone: "+1 234-567-8900", linkedin: "#", image: "https://randomuser.me/api/portraits/men/32.jpg", company: "Tech Corp", role: "Senior Software Engineer" },
      { id: 2, name: "Priya Sharma", field: "mechanical", experience: "3-5", email: "priya.sharma@email.com", phone: "+91 98765-43210", linkedin: "#", image: "https://randomuser.me/api/portraits/women/44.jpg", company: "AutoMek", role: "Mechanical Design Engineer" },
      { id: 3, name: "Carlos Alvarez", field: "electrical", experience: "5+", email: "carlos.alvarez@email.com", phone: "+34 123-456-789", linkedin: "#", image: "https://randomuser.me/api/portraits/men/65.jpg", company: "ElectroWorks", role: "Lead Electrical Engineer" },
      { id: 4, name: "Emily Zhang", field: "civil", experience: "0-2", email: "emily.zhang@email.com", phone: "+86 138-0013-8000", linkedin: "#", image: "https://randomuser.me/api/portraits/women/68.jpg", company: "UrbanBuild", role: "Junior Civil Engineer" },
      { id: 5, name: "Ahmed El-Sayed", field: "software", experience: "3-5", email: "ahmed.elsayed@email.com", phone: "+20 123-456-7890", linkedin: "#", image: "https://randomuser.me/api/portraits/men/23.jpg", company: "Code Solutions", role: "Full Stack Developer" },
      { id: 6, name: "Sofia Rossi", field: "mechanical", experience: "5+", email: "sofia.rossi@email.com", phone: "+39 06 1234 5678", linkedin: "#", image: "https://randomuser.me/api/portraits/women/12.jpg", company: "Innovatech", role: "Senior Mechanical Engineer" },
      { id: 7, name: "David Kim", field: "electrical", experience: "0-2", email: "david.kim@email.com", phone: "+82 10-1234-5678", linkedin: "#", image: "https://randomuser.me/api/portraits/men/75.jpg", company: "PowerGrid", role: "Electrical Engineer" },
      { id: 8, name: "Laura Müller", field: "civil", experience: "3-5", email: "laura.mueller@email.com", phone: "+49 123-456-7890", linkedin: "#", image: "https://randomuser.me/api/portraits/women/36.jpg", company: "EcoStructures", role: "Civil Project Manager" }
    ];

    function createProfileCard(prof) {
      return `
        <div class="col-xl-3 col-lg-4 col-md-6">
          <div class="network-card">
            <img src="${prof.image}" alt="${prof.name}" class="network-avatar">
            <div class="network-info">
              <h3>${prof.name}</h3>
              <p class="role">${prof.role} @ <span class="text-primary fw-bold">${prof.company}</span></p>
              
              <div class="network-meta">
                <div class="network-meta-item">
                  <span class="fs-6">⏱️</span> ${prof.experience} years experience
                </div>
                <div class="network-meta-item">
                  <span class="fs-6">📧</span> ${prof.email}
                </div>
                <div class="network-meta-item">
                  <span class="fs-6">📱</span> ${prof.phone}
                </div>
              </div>
              
              <a href="${prof.linkedin}" target="_blank" class="btn btn-outline-custom w-100 mt-auto">
                <span style="color: #0077b5;">🔗</span> Connect on LinkedIn
              </a>
            </div>
          </div>
        </div>
      `;
    }

    function filterProfessionals() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const fieldFilter = document.getElementById('fieldFilter').value;
      const experienceFilter = document.getElementById('experienceFilter').value;
      const emptyState = document.getElementById('emptyState');

      const filtered = professionals.filter(prof => {
        const matchesSearch = prof.name.toLowerCase().includes(searchTerm) ||
                              prof.company.toLowerCase().includes(searchTerm) ||
                              prof.field.toLowerCase().includes(searchTerm) ||
                              prof.role.toLowerCase().includes(searchTerm);
        const matchesField = fieldFilter === '' || prof.field === fieldFilter;
        const matchesExperience = experienceFilter === '' || prof.experience === experienceFilter;

        return matchesSearch && matchesField && matchesExperience;
      });

      const grid = document.getElementById('professionalsGrid');
      if(filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('d-none');
      } else {
        emptyState.classList.add('d-none');
        grid.innerHTML = filtered.map(prof => createProfileCard(prof)).join('');
      }
    }

    document.getElementById('searchInput').addEventListener('input', filterProfessionals);
    document.getElementById('fieldFilter').addEventListener('change', filterProfessionals);
    document.getElementById('experienceFilter').addEventListener('change', filterProfessionals);

    // Initial load
    filterProfessionals();
  </script>
</body>
</html>
