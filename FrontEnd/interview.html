<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Placement Preparation - GradTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .prep-checklist-item {
      display: flex;
      align-items: center;
      padding: 1rem;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 0.75rem;
      transition: all 0.2s;
      cursor: pointer;
    }
    .prep-checklist-item:hover {
      border-color: var(--accent-primary);
      background: rgba(59, 130, 246, 0.05);
    }
    .prep-checklist-item input[type="checkbox"] {
      width: 24px;
      height: 24px;
      margin-right: 1rem;
      cursor: pointer;
      accent-color: var(--accent-primary);
    }
    .prep-checklist-item.completed {
      background: rgba(16, 185, 129, 0.05);
      border-color: var(--success);
    }
    .prep-checklist-item.completed span {
      text-decoration: line-through;
      color: var(--text-secondary);
    }
    
    .readiness-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: conic-gradient(var(--accent-primary) 0%, var(--bg-input) 0);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .readiness-ring::after {
      content: "";
      position: absolute;
      width: 84px;
      height: 84px;
      background: var(--bg-card);
      border-radius: 50%;
    }
    .readiness-value {
      position: relative;
      z-index: 1;
      font-size: 1.5rem;
      font-weight: 800;
    }

    .question-block {
      background: var(--bg-input);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
      transition: border-color 0.3s;
    }
    .question-block:focus-within {
      border-color: var(--accent-primary);
    }
    .question-label {
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-primary);
      display: block;
    }
    .question-input {
      background: var(--bg-card) !important;
      border: 1px solid var(--border-color) !important;
      color: var(--text-primary) !important;
      border-radius: 8px;
      padding: 1rem;
      resize: vertical;
      min-height: 100px;
    }
    .question-input:focus {
      border-color: var(--accent-primary) !important;
      box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25) !important;
    }
  </style>
</head>
<body>
  <div id="navbar-container"></div>

  <div class="main-content">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4 mb-4">
      <div>
        <h2 class="fw-bold mb-1">Placement Training Tracker 🎯</h2>
        <p class="text-secondary mb-0">Track your interview preparation and practice core concepts.</p>
      </div>
      
      <div class="d-flex align-items-center gap-3 bg-card p-3 rounded-pill" style="background: var(--bg-card); border: 1px solid var(--border-color);">
        <div class="readiness-ring" id="readinessRing">
          <span class="readiness-value" id="readinessText">0%</span>
        </div>
        <div class="pe-3">
          <p class="mb-0 fw-bold lh-1 text-uppercase small text-secondary">Interview</p>
          <p class="mb-0 fw-bold fs-5 text-gradient">Readiness</p>
        </div>
      </div>
    </div>

    <form id="placementForm">
      <div class="row g-4">
        <!-- Checklist Column -->
        <div class="col-lg-5">
          <div class="glass-panel p-4 h-100">
            <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
              <span class="fs-4">📋</span> Preparation Modules
            </h5>
            
            <div class="checklist">
              <label class="prep-checklist-item">
                <input type="checkbox" name="checklist" value="Resume Preparation">
                <span class="fw-semibold">Resume Preparation</span>
              </label>
              
              <label class="prep-checklist-item">
                <input type="checkbox" name="checklist" value="Mock Interviews">
                <span class="fw-semibold">Mock Interviews</span>
              </label>
              
              <label class="prep-checklist-item">
                <input type="checkbox" name="checklist" value="Technical Skills Practice">
                <span class="fw-semibold">Technical Skills Practice</span>
              </label>
              
              <label class="prep-checklist-item">
                <input type="checkbox" name="checklist" value="Soft Skills Training">
                <span class="fw-semibold">Soft Skills Training</span>
              </label>
              
              <label class="prep-checklist-item">
                <input type="checkbox" name="checklist" value="Company Research">
                <span class="fw-semibold">Company Research</span>
              </label>
            </div>
            
            <div class="mt-4 p-3 rounded" style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2);">
              <p class="small text-primary fw-semibold mb-0">💡 Tip: Completing these modules significantly increases your chances of clearing the first round.</p>
            </div>
          </div>
        </div>

        <!-- Questions Column -->
        <div class="col-lg-7">
          <div class="glass-panel p-4">
            <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
              <span class="fs-4">✍️</span> Practice Questions
            </h5>
            
            <div class="questions">
              <div class="question-block">
                <label for="q1" class="question-label">
                  <span class="text-accent small text-uppercase fw-bold d-block mb-1">Programming (OOP)</span>
                  What are the four pillars of Object-Oriented Programming?
                </label>
                <textarea class="form-control question-input" id="q1" name="q1" placeholder="Enter your detailed answer here..."></textarea>
              </div>
              
              <div class="question-block">
                <label for="q2" class="question-label">
                  <span class="text-accent small text-uppercase fw-bold d-block mb-1">Web Development</span>
                  What is a RESTful API?
                </label>
                <textarea class="form-control question-input" id="q2" name="q2" placeholder="Enter your detailed answer here..."></textarea>
              </div>
              
              <div class="question-block">
                <label for="q3" class="question-label">
                  <span class="text-accent small text-uppercase fw-bold d-block mb-1">Databases</span>
                  Explain the difference between SQL and NoSQL databases.
                </label>
                <textarea class="form-control question-input" id="q3" name="q3" placeholder="Enter your detailed answer here..."></textarea>
              </div>
              
              <div class="question-block">
                <label for="q4" class="question-label">
                  <span class="text-accent small text-uppercase fw-bold d-block mb-1">Data Structures</span>
                  What is a linked list and where is it used?
                </label>
                <textarea class="form-control question-input" id="q4" name="q4" placeholder="Enter your detailed answer here..."></textarea>
              </div>
              
              <div class="question-block">
                <label for="q5" class="question-label">
                  <span class="text-accent small text-uppercase fw-bold d-block mb-1">Aptitude</span>
                  If a train travels 60 km in 1 hour and 30 minutes, what is its average speed?
                </label>
                <textarea class="form-control question-input" id="q5" name="q5" placeholder="Enter your detailed answer here..."></textarea>
              </div>
            </div>
            
            <div class="d-flex flex-column align-items-end mt-4">
              <div id="result" class="mb-3 w-100" style="display: none;"></div>
              <button type="submit" class="btn btn-primary-custom px-5 py-3 fs-5 w-100 w-md-auto">
                🚀 Submit Progress
              </button>
            </div>
            
          </div>
        </div>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script>
    // Checklist UI logic
    const checkboxes = document.querySelectorAll('input[name="checklist"]');
    const readinessRing = document.getElementById('readinessRing');
    const readinessText = document.getElementById('readinessText');

    function updateReadiness() {
      let checkedCount = 0;
      checkboxes.forEach(cb => {
        const label = cb.closest('.prep-checklist-item');
        if (cb.checked) {
          checkedCount++;
          label.classList.add('completed');
        } else {
          label.classList.remove('completed');
        }
      });
      
      const pct = Math.round((checkedCount / checkboxes.length) * 100);
      readinessText.textContent = `${pct}%`;
      
      const color = pct === 100 ? 'var(--success)' : pct > 0 ? 'var(--accent-primary)' : 'var(--bg-input)';
      readinessRing.style.background = `conic-gradient(${color} ${pct}%, var(--bg-input) 0)`;
      readinessText.style.color = pct === 100 ? 'var(--success)' : 'var(--text-primary)';
    }

    checkboxes.forEach(cb => {
      cb.addEventListener('change', updateReadiness);
    });

    // Existing Form Submission Logic
    document.getElementById('placementForm').addEventListener('submit', function (e) {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Submitting...`;
      submitBtn.disabled = true;

      const email = localStorage.getItem('userEmail');
      if (!email) {
        window.showToast('User not logged in. Please log in first.', 'error');
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
        return;
      }

      const checklist = [];
      document.querySelectorAll('input[name="checklist"]:checked').forEach(cb => checklist.push(cb.value));
      const answers = [];
      for (let i = 1; i <= 5; i++) {
        answers.push(document.getElementById('q' + i).value.trim());
      }

      const data = { email, checklist, answers };
      fetch('http://127.0.0.1:3000/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(async (response) => {
        if (!response.ok) {
          const contentType = response.headers.get('content-type');
          const errorData = contentType && contentType.includes('application/json')
            ? await response.json()
            : await response.text();
          throw new Error(errorData.error || errorData);
        }
        return response.json();
      })
      .then(data => {
        window.showToast("✅ Submission Successful!", "success");
        document.getElementById('placementForm').reset();
        updateReadiness();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch(error => {
        window.showToast(error.message || "An error occurred during submission.", "error");
      })
      .finally(() => {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
