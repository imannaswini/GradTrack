<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - GradTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .auth-input {
      background-color: var(--bg-input) !important;
      border: 1px solid var(--border-color) !important;
      color: var(--text-primary) !important;
      padding: 0.75rem 1rem;
      border-radius: 8px;
    }
    .auth-input:focus {
      border-color: var(--accent-primary) !important;
      box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25) !important;
    }
  </style>
</head>
<body>
  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <div class="main-content d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 100px);">
    <div class="glass-panel p-5 w-100 hover-lift" style="max-width: 450px; animation: fadeUp 0.6s ease forwards;">
      <div class="text-center mb-4">
        <h3 class="fw-bold mb-1">📝 Create Account</h3>
        <p class="text-secondary small">Join GradTrack and accelerate your career.</p>
      </div>
      
      <form id="signup-form">
        <div class="mb-3">
          <label for="name" class="form-label text-secondary small fw-semibold">Full Name</label>
          <input type="text" class="form-control auth-input" id="name" placeholder="Enter your name" required />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label text-secondary small fw-semibold">Email Address</label>
          <input type="email" class="form-control auth-input" id="email" placeholder="name@example.com" required />
        </div>
        <div class="mb-4">
          <label for="password" class="form-label text-secondary small fw-semibold">Password</label>
          <input type="password" class="form-control auth-input" id="password" placeholder="Create a password" required />
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 mb-3 py-2">Create Account</button>
      </form>
      
      <div id="message" class="text-center small mt-2 fw-semibold"></div>

      <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border-color) !important;">
        <p class="small text-secondary">Already have an account? <a href="signin.html" class="text-decoration-none text-gradient fw-semibold">Sign In</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("signup-form").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const msgDiv = document.getElementById("message");
      const btn = this.querySelector('button[type="submit"]');

      // Loading state
      btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Creating...`;
      btn.disabled = true;

      fetch("http://127.0.0.1:3000/api/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
      })
      .then(response => response.json())
      .then(data => {
        btn.innerHTML = `Create Account`;
        btn.disabled = false;
        
        if (data.message === "Signup successful!") {
          msgDiv.style.color = "var(--success)";
          msgDiv.textContent = data.message;
          localStorage.setItem("token", data.token);
          localStorage.setItem("loggedIn", "true");
          localStorage.setItem("userEmail", data.user.email);
          localStorage.setItem("userName", data.user.name);
          window.showToast("Account created! Redirecting...", "success");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);
        } else {
          msgDiv.style.color = "var(--danger)";
          msgDiv.textContent = data.message || "Signup failed.";
          window.showToast(data.message || "Signup failed.", "error");
        }
      })
      .catch(error => {
        console.error("Signup error:", error);
        btn.innerHTML = `Create Account`;
        btn.disabled = false;
        msgDiv.style.color = "var(--danger)";
        msgDiv.textContent = "An error occurred. Please try again.";
        window.showToast("Connection error. Please try again.", "error");
      });
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
